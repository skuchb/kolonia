<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KOLONIA — powiadomienia</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #12100e;
        color: #e8e0d4;
        font-family: Georgia, "Times New Roman", serif;
        padding: 24px;
      }
      main {
        max-width: 28rem;
        line-height: 1.6;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 1rem;
      }
      ol {
        padding-left: 1.25rem;
      }
      a {
        color: #e8a04c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Włącz powiadomienia dla KOLONII</h1>
      <p>Jeśli ustawienia się nie otworzyły automatycznie:</p>
      <ol>
        <li>Otwórz <strong>Ustawienia</strong> telefonu</li>
        <li><strong>Aplikacje</strong> → <strong>KOLONIA</strong></li>
        <li><strong>Powiadomienia</strong> → włącz</li>
        <li>Wróć do gry i zaznacz checkbox ponownie</li>
      </ol>
      <p><a href="/">Wróć do gry</a></p>
    </main>
  </body>
</html>
